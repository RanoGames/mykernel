# grub.cfg — конфигурация меню GRUB внутри ISO-образа.
# Говорит GRUB, какой файл ядра загружать по Multiboot.

set timeout=0
set default=0

menuentry "MyKernel" {
    # multiboot — команда GRUB для загрузки Multiboot-совместимого ядра.
    # Путь указан относительно корня ISO/загрузочного раздела.
    multiboot /boot/mykernel.bin
    boot
}
